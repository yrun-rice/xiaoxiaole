<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>群友消消乐</title>
    <style>
        /* ========== 全局重置 & 字体 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 30%, #e1bee7 60%, #d1c4e9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            padding: 20px;
            overflow: hidden;
        }

        /* ========== 浮动装饰泡泡 ========== */
        body::before, body::after {
            content: '🌸';
            position: fixed;
            font-size: 40px;
            opacity: 0.2;
            animation: floatBubble 8s ease-in-out infinite;
        }
        body::before { top: 5%; left: 5%; animation-delay: 0s; }
        body::after { bottom: 5%; right: 5%; animation-delay: 4s; }
        @keyframes floatBubble {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(15deg); }
        }

        /* ========== 游戏容器 ========== */
        #game-wrapper {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 30px 35px 35px;
            box-shadow: 0 20px 60px rgba(233, 30, 99, 0.15),
                        0 8px 24px rgba(0, 0, 0, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.5);
            max-width: 640px;
            width: 100%;
        }

        /* ========== 标题 ========== */
        #header {
            text-align: center;
            margin-bottom: 16px;
        }
        #header h1 {
            font-size: 36px;
            background: linear-gradient(135deg, #e91e63, #9c27b0, #ff6f00);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            letter-spacing: 4px;
            line-height: 1.3;
        }
        #header h1::after {
            content: ' 🎮';
            -webkit-text-fill-color: initial;
        }

        /* ========== 信息栏 ========== */
        #info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        #score-display {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            color: #e65100;
            box-shadow: 0 2px 8px rgba(255, 152, 0, 0.2);
            white-space: nowrap;
        }
        #score-display span { color: #bf360c; font-size: 26px; }
        /* (cp-display 已移除) */
        #restart-btn {
            background: linear-gradient(135deg, #ce93d8, #ab47bc);
            border: none;
            color: #fff;
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(156, 39, 176, 0.3);
            transition: all 0.2s;
            white-space: nowrap;
        }
        #restart-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 5px 16px rgba(156, 39, 176, 0.4);
        }
        #restart-btn:active { transform: scale(0.96); }

        /* ========== 游戏棋盘 ========== */
        #board-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 6px;
            box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            width: 100%;
            height: 100%;
        }

        /* ========== 单个方块 ========== */
        .tile {
            border-radius: 10px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            cursor: pointer;
            position: relative;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.10), inset 0 1px 0 rgba(255,255,255,0.4);
            will-change: transform;
        }
        .tile:hover {
            transform: scale(1.06);
            z-index: 2;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }
        .tile.selected {
            transform: scale(1.10);
            box-shadow: 0 0 0 3px #fff, 0 0 20px rgba(233, 30, 99, 0.45);
            z-index: 3;
        }
        .tile.hint {
            animation: hintPulse 0.8s ease-in-out infinite alternate;
        }
        @keyframes hintPulse {
            0% { box-shadow: 0 0 0 2px rgba(255, 193, 7, 0.4); }
            100% { box-shadow: 0 0 0 5px rgba(255, 193, 7, 0.7), 0 0 18px rgba(255, 193, 7, 0.3); }
        }

        /* ========== 消除动画 ========== */
        .tile.matched {
            animation: matchPop 0.4s ease forwards;
        }
        @keyframes matchPop {
            0% { transform: scale(1); opacity: 1; }
            40% { transform: scale(1.2) rotate(8deg); opacity: 0.9; }
            100% { transform: scale(0) rotate(20deg); opacity: 0; }
        }

        /* ========== 下落动画 ========== */
        .tile.dropping {
            transition: transform 0.30s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ========== CP 配对弹窗 ========== */
        #cp-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        #cp-overlay.open { display: flex; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #cp-modal {
            background: linear-gradient(160deg, #fff5f7 0%, #fce4ec 40%, #f3e5f5 100%);
            border-radius: 28px;
            padding: 30px 35px 28px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(233, 30, 99, 0.20);
            border: 2px solid rgba(255, 255, 255, 0.6);
            animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalPop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        #cp-modal h2 {
            text-align: center;
            font-size: 26px;
            color: #c2185b;
            margin-bottom: 6px;
        }
        #cp-modal .sub-title {
            text-align: center;
            font-size: 14px;
            color: #999;
            margin-bottom: 16px;
        }

        /* CP 选择框 */
        #cp-slots {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 18px;
        }
        .cp-slot {
            width: 100px;
            height: 100px;
            border-radius: 16px;
            border: 3px dashed #f48fb1;
            background: rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #ec407a;
            transition: all 0.2s;
            position: relative;
            background-size: cover;
            background-position: center;
        }
        .cp-slot.filled {
            border-style: solid;
            border-color: #e91e63;
        }
        .cp-slot .slot-label {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #f48fb1;
            color: #fff;
            font-size: 13px;
            padding: 0 10px;
            border-radius: 20px;
            font-weight: bold;
        }
        .cp-slot .slot-text {
            font-size: 14px;
            color: #999;
            margin-top: 4px;
        }
        .cp-slot .slot-img {
            width: 100%;
            height: 100%;
            border-radius: 13px;
            object-fit: cover;
            display: none;
        }
        .cp-slot.filled .slot-img { display: block; }
        .cp-slot.filled .slot-text { display: none; }

        /* 头像选择区 */
        #avatar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
            gap: 8px;
            margin-bottom: 18px;
            max-height: 180px;
            overflow-y: auto;
            padding: 4px;
        }
        #avatar-grid::-webkit-scrollbar { width: 4px; }
        #avatar-grid::-webkit-scrollbar-thumb { background: #f48fb1; border-radius: 4px; }
        .avatar-option {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            transition: all 0.15s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .avatar-option:hover {
            transform: scale(1.12);
            border-color: #f06292;
            box-shadow: 0 3px 12px rgba(233, 30, 99, 0.2);
        }
        .avatar-option.active {
            border-color: #e91e63;
            box-shadow: 0 0 0 3px #fce4ec;
        }

        /* 确认按钮 */
        #cp-confirm-btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ec407a, #ab47bc);
            color: #fff;
            font-size: 22px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(233, 30, 99, 0.3);
            transition: all 0.2s;
            margin-bottom: 10px;
        }
        #cp-confirm-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(233, 30, 99, 0.4);
        }
        #cp-confirm-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        #cp-skip {
            text-align: center;
            font-size: 14px;
            color: #b0b0b0;
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: underline dotted;
        }
        #cp-skip:hover { color: #e91e63; }

        /* ========== 错误提示浮动 ========== */
        #toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: rgba(233, 30, 99, 0.92);
            color: #fff;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 18px;
            font-family: inherit;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
            z-index: 2000;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 500px) {
            #game-wrapper { padding: 16px; border-radius: 24px; }
            #header h1 { font-size: 26px; }
            #score-display { font-size: 16px; padding: 6px 14px; }

            #restart-btn { font-size: 14px; padding: 6px 16px; }
            #cp-modal { padding: 20px; }
            #cp-modal h2 { font-size: 20px; }
            .cp-slot { width: 70px; height: 70px; font-size: 26px; }
            #cp-confirm-btn { font-size: 18px; padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- ===== 浮动提示 ===== -->
    <div id="toast"></div>

    <!-- ===== CP 配对弹窗 ===== -->
    <div id="cp-overlay">
        <div id="cp-modal">
            <h2>💕 相亲相爱电子宠物 💕</h2>
            <p class="sub-title">选择两个头像配对为 CP，消除时视为同一种类型哦！</p>

            <div id="cp-slots">
                <div class="cp-slot" data-slot="1">
                    <span class="slot-label">框 1</span>
                    <span class="slot-text">♂</span>
                </div>
                <div class="cp-slot" data-slot="2">
                    <span class="slot-label">框 2</span>
                    <span class="slot-text">♀</span>
                </div>
            </div>

            <p style="text-align:center;font-size:13px;color:#b0b0b0;margin-bottom:12px;">👆 点击上方方框再点选下方头像</p>

            <div id="avatar-grid"></div>

            <button id="cp-confirm-btn" disabled>💍 我同意这门婚事！</button>
            <div id="cp-skip">跳过配对，直接开始游戏</div>
        </div>
    </div>

    <!-- ===== 游戏界面 ===== -->
    <div id="game-wrapper">
        <div id="header">
            <h1>群友消消乐</h1>
        </div>

        <div id="info-bar">
            <div id="score-display">🏆 <span id="score-num">0</span></div>

            <button id="restart-btn">🔄 重新开始</button>
        </div>

        <div id="board-container">
            <div id="board"></div>
        </div>
    </div>

    <script>
        // ============================================================
        //  ★  配  置  ★
        // ============================================================
        const CONFIG = {
            // 🔧 在这里填写 pic/ 文件夹里的图片文件名（不含路径）
            IMAGE_LIST: [
                '波奇.jpg',
                '钓鱼佬.jpg',
                '番茄.jpg',
                '马哥.jpg',
                '末学.jpg',
                '书虫.jpg',
                '素素.jpg',
                '椰子.jpg',
            ],
            GRID_SIZE: 8,
            SCORE_3: 30,
            SCORE_4: 60,
            SCORE_5: 100,
            ANIMATION_DELAY_MS: 380,
        };

        // ============================================================
        //  ★  状  态  ★
        // ============================================================
        let board = [];               // 8×8 -> { type, row, col, el }
        let score = 0;
        let cpPair = null;           // { a: 'filename1', b: 'filename2' } | null
        let selectedTile = null;     // { row, col }
        let isProcessing = false;
        let isDragging = false;
        let dragStartTile = null;
        let loadedImages = [];       // 实际成功加载的图片列表
        let tileSize = 0;

        // DOM 引用
        const boardEl = document.getElementById('board');
        const scoreNum = document.getElementById('score-num');
        // const cpDisplay = document.getElementById('cp-display');  // 已移除
        const restartBtn = document.getElementById('restart-btn');
        const cpOverlay = document.getElementById('cp-overlay');
        const cpModal = document.getElementById('cp-modal');
        const avatarGrid = document.getElementById('avatar-grid');
        const cpSlots = document.querySelectorAll('.cp-slot');
        const cpConfirmBtn = document.getElementById('cp-confirm-btn');
        const cpSkip = document.getElementById('cp-skip');
        const toastEl = document.getElementById('toast');

        let activeSlot = 1;           // 当前正在填的 CP 槽位
        let slotSelection = [null, null];  // [filename, filename]

        // ============================================================
        //  ★  工 具 函 数  ★
        // ============================================================
        function delay(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        function showToast(msg, duration = 2000) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastEl._hideTimer);
            toastEl._hideTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ============================================================
        //  ★  图 片 加 载  ★
        // ============================================================
        function preloadImages() {
            return new Promise((resolve) => {
                const list = CONFIG.IMAGE_LIST;
                if (!list || list.length === 0) {
                    // 没有配置图片，使用内置颜色 + emoji
                    loadedImages = generateFallbackTypes(7);
                    resolve();
                    return;
                }
                let loaded = 0;
                const results = [];
                list.forEach((name, idx) => {
                    const img = new Image();
                    const path = 'pic/' + encodeURI(name);
                    img.onload = () => {
                        results.push({ name, path, index: idx });
                        loaded++;
                        if (loaded === list.length) {
                            loadedImages = results;
                            if (results.length === 0) {
                                loadedImages = generateFallbackTypes(7);
                            }
                            resolve();
                        }
                    };
                    img.onerror = () => {
                        // 图片加载失败，用 fallback
                        results.push(null);
                        loaded++;
                        if (loaded === list.length) {
                            const valid = results.filter(r => r !== null);
                            if (valid.length === 0) {
                                loadedImages = generateFallbackTypes(7);
                            } else {
                                loadedImages = valid;
                            }
                            resolve();
                        }
                    };
                    img.src = path;
                });
                // 超时保护
                setTimeout(() => {
                    if (loadedImages.length === 0) {
                        loadedImages = generateFallbackTypes(7);
                        resolve();
                    }
                }, 3000);
            });
        }

        // 在没有图片时的后备方案——用 emoji + 颜色
        function generateFallbackTypes(count) {
            const fallbacks = [
                '🍎', '🍊', '🍋', '🍇', '🫐', '🍓', '🍑', '🥝', '🍒', '🍉'
            ];
            const colors = [
                '#ef5350', '#ff7043', '#ffee58', '#ab47bc', '#42a5f5',
                '#66bb6a', '#ffa726', '#ec407a', '#26c6da', '#8d6e63'
            ];
            const types = [];
            for (let i = 0; i < Math.min(count, 10); i++) {
                types.push({
                    name: fallbacks[i] || `type${i}`,
                    path: '',
                    fallbackEmoji: fallbacks[i] || '❓',
                    fallbackColor: colors[i % colors.length],
                    index: i,
                });
            }
            return types;
        }

        function getImageInfo(typeName) {
            // 先查 loadedImages
            for (const item of loadedImages) {
                if (item.name === typeName) return item;
            }
            // fallback
            return {
                name: typeName,
                path: 'pic/' + encodeURI(typeName),
                fallbackEmoji: '❓',
                fallbackColor: '#e0e0e0',
            };
        }

        function applyTileStyle(el, typeName) {
            const info = getImageInfo(typeName);
            if (info.path) {
                el.style.backgroundImage = `url('${info.path}')`;
                el.style.backgroundColor = '#f5f5f5';
            } else if (info.fallbackEmoji) {
                el.style.backgroundImage = 'none';
                el.style.backgroundColor = info.fallbackColor || '#e0e0e0';
                el.style.display = 'flex';
                el.style.alignItems = 'center';
                el.style.justifyContent = 'center';
                el.style.fontSize = 'clamp(18px, 3vw, 32px)';
                el.textContent = info.fallbackEmoji;
            }
        }

        // ============================================================
        //  ★  CP 配 对 逻 辑  ★
        // ============================================================
        function typesMatch(a, b) {
            if (a === b) return true;
            if (cpPair) {
                const { a: ca, b: cb } = cpPair;
                if ((a === ca && b === cb) || (a === cb && b === ca)) return true;
            }
            return false;
        }

        // ============================================================
        //  ★  棋 盘 初 始 化  ★
        // ============================================================
        function getRandomType(exclude = null) {
            const pool = loadedImages.filter(t => t.name !== exclude);
            if (pool.length === 0) return loadedImages[Math.floor(Math.random() * loadedImages.length)].name;
            return pool[Math.floor(Math.random() * pool.length)].name;
        }

        // 填充棋盘，避免初始三连
        function initBoard() {
            board = [];
            const size = CONFIG.GRID_SIZE;
            for (let r = 0; r < size; r++) {
                board[r] = [];
                for (let c = 0; c < size; c++) {
                    let type;
                    let attempts = 0;
                    do {
                        type = getRandomType();
                        attempts++;
                        if (attempts > 50) break;
                    } while (wouldMatch(r, c, type));
                    board[r][c] = { type, row: r, col: c, el: null };
                }
            }
        }

        // 检查在 (r,c) 放 type 是否会产生三连（只看左和上）
        function wouldMatch(r, c, type) {
            // 水平检查：左边连续两个相同
            if (c >= 2) {
                const t1 = board[r][c - 1]?.type;
                const t2 = board[r][c - 2]?.type;
                if (t1 && t2 && typesMatch(type, t1) && typesMatch(t1, t2)) return true;
            }
            // 垂直检查：上边连续两个相同
            if (r >= 2) {
                const t1 = board[r - 1]?.[c]?.type;
                const t2 = board[r - 2]?.[c]?.type;
                if (t1 && t2 && typesMatch(type, t1) && typesMatch(t1, t2)) return true;
            }
            return false;
        }

        // ============================================================
        //  ★  渲 染  ★
        // ============================================================
        function renderBoard() {
            boardEl.innerHTML = '';
            const size = CONFIG.GRID_SIZE;
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const tile = board[r][c];
                    const el = document.createElement('div');
                    el.className = 'tile';
                    el.dataset.row = r;
                    el.dataset.col = c;
                    applyTileStyle(el, tile.type);
                    boardEl.appendChild(el);
                    tile.el = el;
                }
            }
            updateScoreAndCP();
        }

        // 重新渲染（保留 board 数据，重建 DOM）
        function rerenderBoard() {
            const size = CONFIG.GRID_SIZE;
            // 清除所有 tile 的 el 引用
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c]) board[r][c].el = null;
                }
            }
            // 从 board 数据重建 DOM
            boardEl.innerHTML = '';
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const tile = board[r][c];
                    if (!tile) continue;
                    const el = document.createElement('div');
                    el.className = 'tile';
                    el.dataset.row = r;
                    el.dataset.col = c;
                    applyTileStyle(el, tile.type);
                    boardEl.appendChild(el);
                    tile.el = el;
                }
            }
        }

        function updateScoreAndCP() {
            scoreNum.textContent = score;
        }

        // ============================================================
        //  ★  查 找 匹 配  ★
        // ============================================================
        function findMatches() {
            const matched = new Set();
            const size = CONFIG.GRID_SIZE;

            // 水平扫描
            for (let r = 0; r < size; r++) {
                let c = 0;
                while (c < size) {
                    const type = board[r][c]?.type;
                    if (!type) { c++; continue; }
                    let end = c + 1;
                    while (end < size && board[r][end] && typesMatch(type, board[r][end].type)) {
                        end++;
                    }
                    if (end - c >= 3) {
                        for (let k = c; k < end; k++) {
                            matched.add(`${r},${k}`);
                        }
                    }
                    c = end;
                }
            }

            // 垂直扫描
            for (let c = 0; c < size; c++) {
                let r = 0;
                while (r < size) {
                    const type = board[r][c]?.type;
                    if (!type) { r++; continue; }
                    let end = r + 1;
                    while (end < size && board[end][c] && typesMatch(type, board[end][c].type)) {
                        end++;
                    }
                    if (end - r >= 3) {
                        for (let k = r; k < end; k++) {
                            matched.add(`${k},${c}`);
                        }
                    }
                    r = end;
                }
            }

            return [...matched].map(key => {
                const [r, c] = key.split(',').map(Number);
                return { row: r, col: c };
            });
        }

        // ============================================================
        //  ★  消 除 · 下 落 · 填 充  循 环  ★
        // ============================================================
        async function processMatchesLoop() {
            if (isProcessing) return;
            isProcessing = true;
            try {
                let matches = findMatches();
                while (matches.length > 0) {
                    // 消除
                    await animateRemove(matches);
                    // 下落
                    await dropAndFill();
                    // 再检查
                    matches = findMatches();
                }
                // 检查是否还有可行操作
                if (!hasValidMoves()) {
                    showToast('😅 没有可消除的组合了，重新洗牌！', 1500);
                    await delay(800);
                    shuffleBoard();
                    // 再次检查
                    let m2 = findMatches();
                    while (m2.length > 0) {
                        await animateRemove(m2);
                        await dropAndFill();
                        m2 = findMatches();
                    }
                }
            } finally {
                isProcessing = false;
                selectedTile = null;
                clearSelection();
            }
        }

        async function animateRemove(matches) {
            const size = CONFIG.GRID_SIZE;
            // 标记消除动画
            for (const m of matches) {
                const tile = board[m.row][m.col];
                if (tile && tile.el) {
                    tile.el.classList.add('matched');
                }
            }

            // 计分
            let totalScore = 0;
            // 按连续段计分 — 但实际上 findMatches 已经返回所有匹配块，
            // 我们按"每组消除"计分比较合理。简单按每次调用计分：
            // 我们改为对每组连续消除分别计分
            // 但在这个简化版本中，所有 matches 是一次性找到的所有匹配块
            // 所以按总匹配数划分成连续组来计分更合理
            // 实际上我们直接按消除数量计分：
            if (matches.length >= 5) {
                totalScore = 100;
            } else if (matches.length >= 4) {
                totalScore = 60;
            } else if (matches.length >= 3) {
                totalScore = 30;
            }
            score += totalScore;
            updateScoreAndCP();

            await delay(CONFIG.ANIMATION_DELAY_MS);

            // 移除
            for (const m of matches) {
                board[m.row][m.col] = null;
            }
        }

        async function dropAndFill() {
            const size = CONFIG.GRID_SIZE;
            let moved = false;

            // 逐列下落
            for (let c = 0; c < size; c++) {
                let writeRow = size - 1;
                for (let r = size - 1; r >= 0; r--) {
                    if (board[r][c] !== null) {
                        if (r !== writeRow) {
                            board[writeRow][c] = board[r][c];
                            board[writeRow][c].row = writeRow;
                            board[writeRow][c].col = c;
                            board[r][c] = null;
                            moved = true;
                        }
                        writeRow--;
                    }
                }
                // 填充顶部空位
                for (let r = writeRow; r >= 0; r--) {
                    const newType = getRandomType();
                    board[r][c] = { type: newType, row: r, col: c, el: null };
                    moved = true;
                }
            }

            if (moved) {
                // 重新渲染
                rerenderBoard();
                await delay(320);
            }
        }

        // ============================================================
        //  ★  交 换 操 作  ★
        // ============================================================
        async function trySwap(r1, c1, r2, c2) {
            if (isProcessing) return false;
            if (!isAdjacent(r1, c1, r2, c2)) return false;

            // 交换
            swapBoard(r1, c1, r2, c2);
            rerenderBoard();

            // 检查是否有匹配
            const matches = findMatches();
            if (matches.length === 0) {
                // 没有匹配，换回
                await delay(200);
                swapBoard(r1, c1, r2, c2);
                rerenderBoard();
                showToast('😅 这样不会消除哦', 1000);
                return false;
            }

            // 有匹配，处理
            await processMatchesLoop();
            return true;
        }

        function swapBoard(r1, c1, r2, c2) {
            const temp = board[r1][c1];
            board[r1][c1] = board[r2][c2];
            board[r2][c2] = temp;
            if (board[r1][c1]) { board[r1][c1].row = r1; board[r1][c1].col = c1; }
            if (board[r2][c2]) { board[r2][c2].row = r2; board[r2][c2].col = c2; }
        }

        function isAdjacent(r1, c1, r2, c2) {
            return (Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1;
        }

        // ============================================================
        //  ★  可 行 操 作 检 查  ★
        // ============================================================
        function hasValidMoves() {
            const size = CONFIG.GRID_SIZE;
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    // 向右交换
                    if (c + 1 < size) {
                        swapBoard(r, c, r, c + 1);
                        if (findMatches().length > 0) {
                            swapBoard(r, c, r, c + 1);
                            return true;
                        }
                        swapBoard(r, c, r, c + 1);
                    }
                    // 向下交换
                    if (r + 1 < size) {
                        swapBoard(r, c, r + 1, c);
                        if (findMatches().length > 0) {
                            swapBoard(r, c, r + 1, c);
                            return true;
                        }
                        swapBoard(r, c, r + 1, c);
                    }
                }
            }
            return false;
        }

        // 洗牌
        function shuffleBoard() {
            const size = CONFIG.GRID_SIZE;
            const allTypes = [];
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c]) allTypes.push(board[r][c].type);
                }
            }
            shuffleArray(allTypes);
            let idx = 0;
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c]) {
                        board[r][c].type = allTypes[idx++];
                    }
                }
            }
            // 如果洗牌后仍有匹配或仍无可行操作，递归重试（限制次数）
            if (findMatches().length > 0 || !hasValidMoves()) {
                // 简单重试：重新填充
                initBoard();
            }
            rerenderBoard();
        }

        // ============================================================
        //  ★  输 入 处 理 —— 点 击 + 拖 拽  ★
        // ============================================================
        function setupInput() {
            boardEl.addEventListener('click', (e) => {
                const tile = e.target.closest('.tile');
                if (!tile || isProcessing) return;
                const r = parseInt(tile.dataset.row);
                const c = parseInt(tile.dataset.col);

                if (selectedTile === null) {
                    selectedTile = { row: r, col: c };
                    tile.classList.add('selected');
                } else {
                    const sr = selectedTile.row;
                    const sc = selectedTile.col;
                    // 清除选中
                    clearSelection();
                    if (sr === r && sc === c) {
                        selectedTile = null;
                        return;
                    }
                    if (isAdjacent(sr, sc, r, c)) {
                        trySwap(sr, sc, r, c);
                    } else {
                        // 选中新的
                        selectedTile = { row: r, col: c };
                        tile.classList.add('selected');
                    }
                }
            });

            // 拖拽交换
            boardEl.addEventListener('mousedown', (e) => {
                const tile = e.target.closest('.tile');
                if (!tile || isProcessing) return;
                isDragging = true;
                dragStartTile = {
                    row: parseInt(tile.dataset.row),
                    col: parseInt(tile.dataset.col),
                };
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging || !dragStartTile) return;
                // 我们不在此做视觉反馈，只是检测拖拽方向
            });

            document.addEventListener('mouseup', (e) => {
                if (!isDragging || !dragStartTile) {
                    isDragging = false;
                    return;
                }
                isDragging = false;
                const tile = e.target.closest('.tile');
                if (!tile) { dragStartTile = null; return; }
                const endR = parseInt(tile.dataset.row);
                const endC = parseInt(tile.dataset.col);
                const startR = dragStartTile.row;
                const startC = dragStartTile.col;
                dragStartTile = null;

                if (startR === endR && startC === endC) return;
                if (!isAdjacent(startR, startC, endR, endC)) return;

                clearSelection();
                trySwap(startR, startC, endR, endC);
            });

            // 触摸支持
            let touchStartPos = null;
            let touchStartTile = null;

            boardEl.addEventListener('touchstart', (e) => {
                if (isProcessing) return;
                const touch = e.changedTouches[0];
                const tile = document.elementFromPoint(touch.clientX, touch.clientY);
                if (!tile || !tile.classList.contains('tile')) return;
                touchStartPos = { x: touch.clientX, y: touch.clientY };
                touchStartTile = {
                    row: parseInt(tile.dataset.row),
                    col: parseInt(tile.dataset.col),
                };
            }, { passive: true });

            boardEl.addEventListener('touchend', (e) => {
                if (!touchStartPos || !touchStartTile) { touchStartPos = null; touchStartTile = null; return; }
                const touch = e.changedTouches[0];
                const dx = touch.clientX - touchStartPos.x;
                const dy = touch.clientY - touchStartPos.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                touchStartPos = null;

                if (dist < 10) {
                    // 当作点击
                    const tile = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (!tile || !tile.classList.contains('tile')) { touchStartTile = null; return; }
                    const r = parseInt(tile.dataset.row);
                    const c = parseInt(tile.dataset.col);
                    if (isProcessing) { touchStartTile = null; return; }

                    if (selectedTile === null) {
                        selectedTile = { row: r, col: c };
                        tile.classList.add('selected');
                    } else {
                        const sr = selectedTile.row;
                        const sc = selectedTile.col;
                        clearSelection();
                        if (sr === r && sc === c) {
                            selectedTile = null;
                            touchStartTile = null;
                            return;
                        }
                        if (isAdjacent(sr, sc, r, c)) {
                            trySwap(sr, sc, r, c);
                        } else {
                            selectedTile = { row: r, col: c };
                            tile.classList.add('selected');
                        }
                    }
                    touchStartTile = null;
                    return;
                }

                // 拖拽交换
                if (!touchStartTile) return;
                let dr = 0, dc = 0;
                if (Math.abs(dx) > Math.abs(dy)) {
                    dc = dx > 0 ? 1 : -1;
                } else {
                    dr = dy > 0 ? 1 : -1;
                }
                const sr = touchStartTile.row;
                const sc = touchStartTile.col;
                const tr = sr + dr;
                const tc = sc + dc;
                touchStartTile = null;
                if (tr < 0 || tr >= CONFIG.GRID_SIZE || tc < 0 || tc >= CONFIG.GRID_SIZE) return;
                clearSelection();
                trySwap(sr, sc, tr, tc);
            }, { passive: true });
        }

        function clearSelection() {
            document.querySelectorAll('.tile.selected').forEach(el => el.classList.remove('selected'));
            selectedTile = null;
        }

        // ============================================================
        //  ★  CP 配 对 弹 窗  ★
        // ============================================================
        function openCPSetup() {
            cpOverlay.classList.add('open');
            activeSlot = 1;
            slotSelection = [null, null];
            updateSlotUI();
            cpConfirmBtn.disabled = true;
            renderAvatarGrid();
        }

        function closeCPSetup() {
            cpOverlay.classList.remove('open');
        }

        function renderAvatarGrid() {
            avatarGrid.innerHTML = '';
            for (const img of loadedImages) {
                const div = document.createElement('div');
                div.className = 'avatar-option';
                div.dataset.name = img.name;
                if (img.path) {
                    div.style.backgroundImage = `url('${img.path}')`;
                } else if (img.fallbackEmoji) {
                    div.style.backgroundImage = 'none';
                    div.style.backgroundColor = img.fallbackColor || '#e0e0e0';
                    div.style.display = 'flex';
                    div.style.alignItems = 'center';
                    div.style.justifyContent = 'center';
                    div.style.fontSize = '22px';
                    div.textContent = img.fallbackEmoji;
                }
                div.addEventListener('click', () => {
                    const name = div.dataset.name;
                    // 检查是否已选
                    const otherSlot = activeSlot === 1 ? 1 : 0; // 另一个槽位索引
                    if (slotSelection[otherSlot] === name) {
                        showToast('😳 不能和自己配对哦！', 1500);
                        return;
                    }
                    slotSelection[activeSlot - 1] = name;
                    updateSlotUI();
                    // 自动切换到另一个槽位
                    if (slotSelection[0] && slotSelection[1]) {
                        cpConfirmBtn.disabled = false;
                    } else {
                        activeSlot = activeSlot === 1 ? 2 : 1;
                        updateSlotUI();
                    }
                });
                avatarGrid.appendChild(div);
            }
        }

        function updateSlotUI() {
            cpSlots.forEach((slot, idx) => {
                const val = slotSelection[idx];
                if (val) {
                    const info = getImageInfo(val);
                    slot.classList.add('filled');
                    if (info.path) {
                        slot.style.backgroundImage = `url('${info.path}')`;
                        slot.style.fontSize = '0';
                        slot.textContent = '';
                    } else if (info.fallbackEmoji) {
                        slot.style.backgroundImage = 'none';
                        slot.style.backgroundColor = info.fallbackColor || '#e0e0e0';
                        slot.style.fontSize = '36px';
                        slot.textContent = info.fallbackEmoji;
                    }
                } else {
                    slot.classList.remove('filled');
                    slot.style.backgroundImage = 'none';
                    slot.style.backgroundColor = 'rgba(255,255,255,0.5)';
                    slot.style.fontSize = '36px';
                    slot.innerHTML = `<span class="slot-label">框 ${idx + 1}</span><span class="slot-text">${idx === 0 ? '♂' : '♀'}</span>`;
                }
                // 高亮激活槽
                if (activeSlot === idx + 1 && !slotSelection[idx]) {
                    slot.style.borderColor = '#e91e63';
                    slot.style.boxShadow = '0 0 12px rgba(233,30,99,0.2)';
                } else {
                    slot.style.borderColor = slotSelection[idx] ? '#e91e63' : '#f48fb1';
                    slot.style.boxShadow = 'none';
                }
            });
        }

        // 点击槽位切换激活
        cpSlots.forEach((slot, idx) => {
            slot.addEventListener('click', () => {
                if (!slotSelection[idx]) {
                    activeSlot = idx + 1;
                    updateSlotUI();
                }
            });
        });

        // 确认 CP
        cpConfirmBtn.addEventListener('click', () => {
            if (!slotSelection[0] || !slotSelection[1]) return;
            cpPair = { a: slotSelection[0], b: slotSelection[1] };
            closeCPSetup();
            startGame();
        });

        cpSkip.addEventListener('click', () => {
            cpPair = null;
            closeCPSetup();
            startGame();
        });

        // ============================================================
        //  ★  游 戏 生 命 周 期  ★
        // ============================================================
        async function startGame() {
            score = 0;
            selectedTile = null;
            isProcessing = false;
            initBoard();
            // 检查初始有无匹配（理论上不应有，但双重保险）
            let matches = findMatches();
            while (matches.length > 0) {
                for (const m of matches) board[m.row][m.col] = null;
                await dropAndFill();
                matches = findMatches();
            }
            renderBoard();
            updateScoreAndCP();
            // 检查可行操作
            if (!hasValidMoves()) {
                shuffleBoard();
            }
        }

        restartBtn.addEventListener('click', () => {
            if (isProcessing) return;
            openCPSetup();
        });

        // ============================================================
        //  ★  初 始 化  ★
        // ============================================================
        async function init() {
            // 加载图片
            await preloadImages();
            // 设置输入
            setupInput();
            // 打开 CP 配对窗口
            openCPSetup();
        }

        init();
    </script>
</body>
